<div class="evaluation-page">
  <!-- Header / Badge -->
  <header class="eval-badge">
    <div class="badge-icon-wrapper">
      <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <div class="badge-text">
      <span class="badge-label">CURRENTLY JUDGING</span>
      <span class="badge-participant">{{ participantName() }}</span>
    </div>
  </header>

  <!-- Messages -->
  @if (errorMessage()) {
    <div class="alert alert-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      {{ errorMessage() }}
    </div>
  }

  @if (successMessage()) {
    <div class="alert alert-success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      {{ successMessage() }}
    </div>
  }

  <!-- Criteria Sliders -->
  <section class="criteria-list">
    @for (criterion of criteria(); track $index; let i = $index) {
      <div class="criterion-item">
        <div class="criterion-header">
          <span class="criterion-name">{{ criterion.name }}</span>
          <span class="criterion-score">{{ criterion.score | number:'1.1-1' }}</span>
        </div>
        <div class="criterion-slider-wrapper">
          <input 
            type="range" 
            class="custom-slider"
            min="0" 
            max="10" 
            step="0.1" 
            [ngModel]="criterion.score"
            (ngModelChange)="updateCriterion(i, 'score', $event)"
          />
        </div>
      </div>
    }
  </section>

  <!-- Observations -->
  <section class="observations-section">
    <textarea
      [ngModel]="observations()"
      (ngModelChange)="observations.set($event)"
      placeholder="Escribe tus observaciones aquí..."
      rows="3"
      maxlength="1000"
      class="observations-textarea"
    ></textarea>
  </section>

  <!-- Submit Button -->
  <div class="form-actions">
    <button class="btn-cancel" (click)="goBack()">Cancelar</button>
    <button
      class="btn-submit-final"
      [disabled]="!isValid() || isSubmitting()"
      (click)="onSubmit()"
    >
      @if (isSubmitting()) {
        <span class="spinner"></span>
      }
      Submit Final Score
    </button>
  </div>
</div>
