<form [formGroup]="overlayForm" (ngSubmit)="onSubmit()" class="overlay-editor">
  <h3>Marcador en vivo</h3>

  <div class="form-group">
    <label for="currentSlotId">Turno / Slot actual *</label>
    <input type="text" id="currentSlotId" formControlName="currentSlotId" placeholder="Ej: ronda-1-pareja-3">
    @if (isFieldInvalid('currentSlotId')) {
      <span class="field-error">El slot actual es obligatorio</span>
    }
  </div>

  <div class="form-group">
    <label for="participantLabel">Competidor / Grupo *</label>
    <input type="text" id="participantLabel" formControlName="participantLabel" placeholder="Ej: María y Juan">
    @if (isFieldInvalid('participantLabel')) {
      <span class="field-error">El nombre del competidor es obligatorio</span>
    }
  </div>

  <div class="form-group">
    <label for="realTimeScore">Puntaje *</label>
    <input type="number" id="realTimeScore" formControlName="realTimeScore" min="0" step="0.1">
    @if (isFieldInvalid('realTimeScore')) {
      <span class="field-error">Ingresa un puntaje válido</span>
    }
  </div>

  <label class="checkbox-label">
    <input type="checkbox" formControlName="isActive">
    <span>Mostrar overlay a los espectadores</span>
  </label>

  <button type="submit" class="btn btn-primary btn-block" [disabled]="isSaving()">
    @if (isSaving()) {
      <span class="spinner"></span>
      Actualizando...
    } @else {
      Actualizar overlay
    }
  </button>
</form>
