<div class="forgot-container">
  <div class="forgot-card">
    <div class="forgot-header">
      <div class="forgot-brand">
        <img class="brand-icon" src="/FondoWorDancePNG.png" alt="World Dance">
        <span class="brand-text">WorldDance</span>
      </div>
      <h1>Recuperar contraseña</h1>
      <p class="forgot-subtitle">
        Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña
      </p>
    </div>

    @if (!emailSent()) {
      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="forgot-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input 
            type="email" 
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="ejemplo@correo.com"
            required
            autocomplete="email"
          >
        </div>

        @if (errorMessage()) {
          <div class="error-message">
            {{ errorMessage() }}
          </div>
        }

        <button 
          type="submit" 
          class="btn btn-primary btn-block btn-lg"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="spinner"></span>
            Enviando...
          } @else {
            Enviar enlace de recuperación
          }
        </button>
      </form>
    } @else {
      <div class="success-message">
        <span class="success-icon">✓</span>
        <h3>¡Correo enviado!</h3>
        <p>{{ successMessage() }}</p>
        <a routerLink="/auth/login" class="btn btn-outline">Volver al inicio de sesión</a>
      </div>
    }

    <div class="forgot-footer">
      <p>
        <a routerLink="/auth/login">← Volver a iniciar sesión</a>
      </p>
    </div>
  </div>
</div>
