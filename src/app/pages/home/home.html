<div class="home-container">
  <section class="hero">
    <div class="container">
      <div class="hero-content">
        <!-- Logo y título -->
        <div class="hero-header">
          <div class="logo-wrapper">
            <svg class="logo-icon" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="60" height="60" rx="16" fill="url(#gradient)" />
              <path d="M18 42 L30 18 L42 42" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <circle cx="30" cy="18" r="5" fill="white" />
              <path d="M22 30 Q30 20 38 30" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
              <defs>
                <linearGradient id="gradient" x1="0" y1="0" x2="60" y2="60">
                  <stop offset="0%" stop-color="#7C3AED"/>
                  <stop offset="100%" stop-color="#5B21B6"/>
                </linearGradient>
              </defs>
            </svg>
            <span class="brand-text">
              <span class="text-gradient">World</span>Dance
            </span>
          </div>
        </div>

        <p class="hero-description">
          Plataforma de gestión de competencias de danza.<br>
          Organiza, participa, evalúa y celebra el talento.
        </p>

        <div class="hero-actions">
          <a routerLink="/auth/login" class="btn btn-primary">
            Iniciar Sesión
          </a>
          <a routerLink="/events" class="btn btn-outline-light">
            Ver Eventos
          </a>
        </div>
      </div>
    </div>
  </section>
</div>
