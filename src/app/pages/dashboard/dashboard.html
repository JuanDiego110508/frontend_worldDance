<div class="dashboard-container">
  <div class="container">
    <div class="dashboard-header">
      <h1>Dashboard</h1>
      <button class="btn btn-outline" (click)="logout()">Cerrar Sesión</button>
    </div>

    <div class="dashboard-welcome">
      <h2>Bienvenido, {{ user?.firstName || 'Usuario' }}</h2>
      <p>Rol: <strong>{{ user?.role || 'Usuario' }}</strong></p>
    </div>

    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3>Mis Eventos</h3>
        <p class="card-value">0</p>
        <a routerLink="/events" class="card-link">Ver todos</a>
      </div>

      <div class="dashboard-card">
        <h3>Inscripciones</h3>
        <p class="card-value">0</p>
        <a routerLink="/enrollment" class="card-link">Gestionar</a>
      </div>

      <div class="dashboard-card">
        <h3>Mi Perfil</h3>
        <p class="card-value">•</p>
        <a routerLink="/auth/profile" class="card-link">Editar</a>
      </div>
    </div>
  </div>
</div>
